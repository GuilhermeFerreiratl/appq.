<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Cracker | Simulador Grover</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #131b2e;
            --primary: #00f2fe;
            --secondary: #4facfe;
            --success: #00e676;
            --error: #ff5252;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .app {
            background: var(--card);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #1e293b;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        h1 {
            text-align: center;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .sub {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: bold;
        }
        .row { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type="text"] {
            flex: 1;
            background: #090d16;
            border: 1px solid #334155;
            color: var(--primary);
            font-size: 1.3rem;
            letter-spacing: 5px;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
        .btn-sec {
            background: #1e293b;
            color: var(--text);
            padding: 0 14px;
            border: 1px solid #334155;
        }
        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            color: #0b0f19;
            font-size: 1rem;
            margin-top: 8px;
        }
        .slider-box { margin-bottom: 16px; }
        .slider-top { display: flex; justify-content: space-between; font-size: 0.8rem; }
        input[type="range"] { width: 100%; margin-top: 6px; accent-color: var(--primary); }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 20px;
        }
        .card {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 10px 4px;
            text-align: center;
        }
        .card.hit { border-color: var(--success); }
        .card.miss { border-color: var(--error); }
        .c-title { font-size: 0.7rem; color: var(--muted); }
        .c-val { font-size: 1.4rem; font-weight: bold; margin: 4px 0; }
        .c-stat { font-size: 0.65rem; font-weight: bold; }
        .hit .c-val, .hit .c-stat { color: var(--success); }
        .miss .c-val, .miss .c-stat { color: var(--error); }
        .resumo {
            margin-top: 18px;
            background: #090d16;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            display: none;
        }
        .res-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .erro {
            color: var(--error);
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="app">
    <h1>QUANTUM CRACKER</h1>
    <p class="sub">Simulador Matemático de Grover (8 Registradores)</p>

    <label>SENHA DE 8 DÍGITOS</label>
    <div class="row">
        <input type="text" id="senha" maxlength="8" value="12345678" inputmode="numeric">
        <button class="btn-sec" onclick="gerarAleatoria()">Aleatória</button>
    </div>
    <div class="erro" id="msgErro">Digite exatamente 8 números de 0 a 9.</div>

    <div class="slider-box">
        <div class="slider-top">
            <span>PULSOS QUÂNTICOS</span>
            <span id="txtPulsos" style="color: var(--primary);">2 Pulsos (~96.1%)</span>
        </div>
        <input type="range" id="pulsos" min="1" max="3" value="2" oninput="mudarPulso()">
    </div>

    <button class="btn-main" onclick="rodar()">EXECUTAR MEDIÇÃO</button>

    <div class="grid" id="grid"></div>

    <div class="resumo" id="resumo">
        <div class="res-line">
            <span>Senha Alvo:</span>
            <strong id="outAlvo">--------</strong>
        </div>
        <div class="res-line">
            <span>Senha Medida:</span>
            <strong id="outMedida" style="color: var(--primary);">--------</strong>
        </div>
        <div class="res-line" style="margin-bottom: 0;">
            <span>Precisão:</span>
            <strong id="outPct" style="color: var(--success);">0%</strong>
        </div>
    </div>
</div>

<script>
    const grid = document.getElementById('grid');
    for (let i = 1; i <= 8; i++) {
        grid.innerHTML += `
            <div class="card" id="c-${i}">
                <div class="c-title">RAND ${i}</div>
                <div class="c-val" id="v-${i}">?</div>
                <div class="c-stat" id="s-${i}">PRONTO</div>
            </div>
        `;
    }

    function mudarPulso() {
        const p = document.getElementById('pulsos').value;
        const txt = document.getElementById('txtPulsos');
        if (p == "1") txt.innerText = "1 Pulso (~78.4%)";
        if (p == "2") txt.innerText = "2 Pulsos (~96.1%)";
        if (p == "3") txt.innerText = "3 Pulsos (~58.0%)";
    }

    function gerarAleatoria() {
        let s = "";
        for (let i = 0; i < 8; i++) s += Math.floor(Math.random() * 10);
        document.getElementById('senha').value = s;
        document.getElementById('msgErro').style.display = 'none';
    }

    function grover(alvo, pulsos) {
        let amp = [];
        let ini = 1.0 / Math.sqrt(10.0);
        for (let i = 0; i < 10; i++) amp.push(ini);

        for (let p = 0; p < pulsos; p++) {
            amp[alvo] = -amp[alvo];
            let soma = 0;
            for (let i = 0; i < 10; i++) soma += amp[i];
            let media = soma / 10.0;
            for (let i = 0; i < 10; i++) amp[i] = (2.0 * media) - amp[i];
        }

        let r = Math.random();
        let acc = 0;
        for (let i = 0; i < 10; i++) {
            acc += amp[i] * amp[i];
            if (r <= acc) return i;
        }
        return 9;
    }

    function rodar() {
        const senha = document.getElementById('senha').value.trim();
        const erro = document.getElementById('msgErro');

        if (!/^\d{8}$/.test(senha)) {
            erro.style.display = 'block';
            return;
        }
        erro.style.display = 'none';

        const pulsos = parseInt(document.getElementById('pulsos').value);
        let acertos = 0;
        let encontrada = "";

        for (let i = 0; i < 8; i++) {
            const alvo = parseInt(senha[i]);
            const medido = grover(alvo, pulsos);
            encontrada += medido;

            const card = document.getElementById('c-' + (i + 1));
            const val = document.getElementById('v-' + (i + 1));
            const stat = document.getElementById('s-' + (i + 1));

            val.innerText = medido;
            card.className = 'card';

            if (medido === alvo) {
                card.classList.add('hit');
                stat.innerText = "ACERTOU";
                acertos++;
            } else {
                card.classList.add('miss');
                stat.innerText = "ERA " + alvo;
            }
        }

        const pct = ((acertos / 8) * 100).toFixed(1);
        document.getElementById('resumo').style.display = 'block';
        document.getElementById('outAlvo').innerText = senha;
        document.getElementById('outMedida').innerText = encontrada;
        document.getElementById('outPct').innerText = pct + "% (" + acertos + "/8)";
    }

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const s = params.get('senha');
        if (s && /^\d{8}$/.test(s)) {
            document.getElementById('senha').value = s;
            if (params.get('auto') === '1') rodar();
        }
    };
</script>

</body>
</html>
