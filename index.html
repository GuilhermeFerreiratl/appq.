<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Cracker | Simulador Algoritmo de Grover</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #131b2e;
            --primary: #00f2fe;
            --secondary: #4facfe;
            --success: #00e676;
            --error: #ff5252;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: var(--card);
            width: 100%;
            max-width: 540px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.6rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        header p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #090d16;
            border: 1px solid #2d3748;
            color: var(--primary);
            font-size: 1.4rem;
            letter-spacing: 6px;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            outline: none;
            font-weight: bold;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.btn-random {
            background: #1e293b;
            color: var(--text);
            border: 1px solid #334155;
            padding: 0 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        button.btn-random:hover {
            background: #334155;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            margin-top: 8px;
            cursor: pointer;
        }

        button.btn-run {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            color: #0b0f19;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button.btn-run:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
        }

        .rands-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .rand-card {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .rand-card.hit {
            border-color: var(--success);
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
        }

        .rand-card.miss {
            border-color: var(--error);
            box-shadow: 0 0 15px rgba(255, 82, 82, 0.2);
        }

        .rand-title {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .rand-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--text);
        }

        .rand-status {
            font-size: 0.7rem;
            margin-top: 4px;
            font-weight: 600;
        }

        .hit .rand-value, .hit .rand-status { color: var(--success); }
        .miss .rand-value, .miss .rand-status { color: var(--error); }

        .summary-box {
            margin-top: 25px;
            background: #090d16;
            border-radius: 14px;
            padding: 18px;
            border: 1px solid #1e293b;
            display: none;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px solid #1e293b;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--success));
            width: 0%;
            transition: width 0.5s ease;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>⚛️ QUANTUM CRACKER</h1>
        <p>Simulador do Algoritmo de Grover (8 Registradores)</p>
    </header>

    <div class="control-group">
        <label for="senhaInput">SENHA ALVO (8 DÍGITOS)</label>
        <div class="input-row">
            <input type="text" id="senhaInput" maxlength="8" value="12345678" placeholder="00000000">
            <button class="btn-random" onclick="gerarSenhaAleatoria()">🎲 Aleatória</button>
        </div>
        <div class="error-msg" id="errorMsg">Digite exatamente 8 números (0 a 9).</div>
    </div>

    <div class="control-group">
        <div class="slider-header">
            <label for="pulsosRange">PULSOS QUÂNTICOS (GROVER)</label>
            <span class="badge" id="pulsosLabel">2 Pulsos (~96.1% prob.)</span>
        </div>
        <input type="range" id="pulsosRange" min="1" max="3" value="2" oninput="atualizarSlider()">
    </div>

    <button class="btn-run" onclick="executarSimulacao()">⚡ EXECUTAR MEDIÇÃO QUÂNTICA</button>

    <div class="rands-grid" id="randsGrid">
        <!-- Os 8 cards Rand 1 a Rand 8 serão gerados aqui -->
    </div>

    <div class="summary-box" id="summaryBox">
        <div class="summary-row">
            <span>Senha Original:</span>
            <strong id="resOriginal" style="letter-spacing: 3px;">--------</strong>
        </div>
        <div class="summary-row">
            <span>Colapso Medido:</span>
            <strong id="resMedida" style="letter-spacing: 3px; color: var(--primary);">--------</strong>
        </div>
        <div class="summary-row">
            <span>Taxa de Precisão:</span>
            <span id="resPorcentagem" style="color: var(--success);">0%</span>
        </div>
        <div class="progress-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
</div>

<script>
    // Inicializa os 8 cards vazios na tela
    const grid = document.getElementById('randsGrid');
    for (let i = 1; i <= 8; i++) {
        grid.innerHTML += `
            <div class="rand-card" id="card-${i}">
                <div class="rand-title">RAND ${i}</div>
                <div class="rand-value" id="val-${i}">?</div>
                <div class="rand-status" id="stat-${i}">SUPERPOSIÇÃO</div>
            </div>
        `;
    }

    function atualizarSlider() {
        const p = document.getElementById('pulsosRange').value;
        const label = document.getElementById('pulsosLabel');
        if (p == 1) label.innerText = "1 Pulso (~78.4% prob.)";
        if (p == 2) label.innerText = "2 Pulsos (~96.1% prob.)";
        if (p == 3) label.innerText = "3 Pulsos (~58.0% prob. - Over-rotation)";
    }

    function gerarSenhaAleatoria() {
        let senha = "";
        for (let i = 0; i < 8; i++) {
            senha += Math.floor(Math.random() * 10);
        }
        document.getElementById('senhaInput').value = senha;
        document.getElementById('errorMsg').style.display = 'none';
    }

    // Motor Matemático Real do Algoritmo de Grover (N = 10 estados)
    function resolverDigitoQuantico(digitoAlvo, pulsos) {
        let amplitudes = new Array(10).fill(1.0 / Math.sqrt(10.0));

        for (let p = 0; p < pulsos; p++) {
            // Oráculo Quântico: inverte a fase do dígito alvo
            amplitudes[digitoAlvo] = -amplitudes[digitoAlvo];

            // Difusor de Grover: inversão em torno da média
